version: "3.8"

services:
  coordinator:
    build:
      context: ..
      dockerfile: deploy/coordinator.Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - REPLICATION_FACTOR=3
    depends_on:
      - node-1
      - node-2
      - node-3

  node-1:
    build:
      context: ..
      dockerfile: deploy/node.Dockerfile
    ports:
      - "9001:9001"
    environment:
      - NODE_ID=node-1
      - PORT=9001
      - COORDINATOR_URL=http://coordinator:8080

  node-2:
    build:
      context: ..
      dockerfile: deploy/node.Dockerfile
    ports:
      - "9002:9002"
    environment:
      - NODE_ID=node-2
      - PORT=9002
      - COORDINATOR_URL=http://coordinator:8080

  node-3:
    build:
      context: ..
      dockerfile: deploy/node.Dockerfile
    ports:
      - "9003:9003"
    environment:
      - NODE_ID=node-3
      - PORT=9003
      - COORDINATOR_URL=http://coordinator:8080
